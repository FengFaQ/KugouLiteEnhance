plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.kugouliteenhance'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.kugouliteenhance'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API (compileOnly — provided by the framework at runtime)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // DexKit — runtime dex feature discovery (mirrors reference hookByDexKit)
    implementation 'org.luckypray:dexkit:2.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}
