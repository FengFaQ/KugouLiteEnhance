plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.kugouliteenhance'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.kugouliteenhance'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Align Kotlin stdlib modules: DexKit pulls old jdk7/jdk8 1.6.21 artifacts whose
// classes now live in kotlin-stdlib 1.8.22, causing checkDebugDuplicateClasses errors.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // Xposed API (compileOnly — provided by the framework at runtime)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // DexKit — runtime dex feature discovery (mirrors reference hookByDexKit)
    implementation 'org.luckypray:dexkit:2.1.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
}
